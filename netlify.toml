[build]
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production.environment]
  NEXTAUTH_URL = "https://shree-mahendra-school.netlify.app"
  NEXTAUTH_SECRET = "your-production-secret-key-here"

[context.deploy-preview.environment]
  NEXTAUTH_URL = "https://deploy-preview-$DEPLOY_ID--shree-mahendra-school.netlify.app"

[context.branch-deploy.environment]
  NEXTAUTH_URL = "https://$BRANCH--shree-mahendra-school.netlify.app"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;"
